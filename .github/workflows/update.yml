name: update-data
on:
  schedule: [{cron: "30 14 * * *"}]   # daily 21:30 Thai time (after Thai/Lao/Hanoi draws)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/update.py --selftest
      - run: python scripts/update.py --pages 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json; git diff --cached --quiet || (git commit -m "update data" && git push)
